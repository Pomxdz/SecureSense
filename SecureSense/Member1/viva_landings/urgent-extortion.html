<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CoreGuard — Security incident review</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f5f9;color:#263445;font:16px Arial,sans-serif}header{background:white;border-bottom:1px solid #e3e8ef;padding:25px 8%;font-size:27px;color:#c62828;font-weight:bold}main{max-width:460px;margin:48px auto;padding:36px;background:white;border:1px solid #e3e8ef;border-radius:12px;box-shadow:0 12px 40px #1823350a}h1{font-size:25px;font-weight:normal}.card{padding:18px;background:#f4f7fb;border-left:3px solid #c62828;font-size:14px;line-height:1.7;margin:24px 0}label{display:block;font-size:14px;margin-top:18px}input{width:100%;padding:14px;border:1px solid #a8b5c5;border-radius:5px;margin-top:8px;font-size:16px}button{width:100%;padding:15px;background:#c62828;color:white;border:0;border-radius:5px;font-size:16px;margin-top:25px;cursor:pointer}button:disabled{opacity:.6}small{display:block;color:#65758a;line-height:1.7;font-size:12px;margin-top:24px}.tag{color:#c62828;font-size:11px;font-weight:bold;letter-spacing:1px}#bridgeStatus{color:#a52121;line-height:1.5}@media(max-width:520px){main{margin:22px 12px;padding:25px}}</style></head><body><header>CoreGuard</header><main><h1>Security incident review</h1><div class="card">Security desk · Case CG-2026-104 · Review requested</div><p>Confirm your username and password to continue.</p><form method="POST" autocomplete="off"><label for="testEmail">Username</label><input id="testEmail" name="email" type="email" required pattern="[^@]+@example\.test" placeholder="name@example.test"><label for="practicePassword">Password</label><input id="practicePassword" type="password" required minlength="1" autocomplete="off" placeholder="Enter a training-only password"><button type="submit">Review security notice</button></form><p id="bridgeStatus" role="status" aria-live="polite"></p></main></body></html>
