<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SecureSense · Sign in</title><link rel="stylesheet" href="style.css"><script src="script.js" defer></script><script src="typing.js" defer></script></head>
<body class="login-body" data-page="login"><div class="login-background" aria-hidden="true"></div>
<main class="login-card">
<div class="kicker">Human cyber risk and awareness</div>
<h1>SecureSense</h1>
<p class="typing-line"><span id="typingText" aria-hidden="true">Build the confidence to spot phishing.</span><span class="visually-hidden">Build the confidence to spot phishing.</span></p>
<form id="loginForm"><label for="loginEmail">Email address</label><input id="loginEmail" type="email" autocomplete="username" required><label for="loginPassword">Password</label><input id="loginPassword" type="password" autocomplete="current-password" required><button type="submit">Sign in</button></form>
<div id="loginError" role="alert" class="error-text"></div>
<small>Use your company training account to continue.</small>
</main></body></html>
